# Packages the addon and publishes it whenever a version tag is pushed:
#   git tag 0.1.0-beta1 && git push origin 0.1.0-beta1
#
# Release policy: every file stays Beta while WoW: Forever is in beta, so tag
# 0.1.0-beta1, 0.1.0-beta2, ... The packager derives the file type from the
# tag: "beta" in it makes a Beta file. A plain tag (1.0.0) makes a Release -
# use one only once Forever has launched and the features are verified, and
# never mix the two within the Forever flavor: a single Release file would
# take precedence over newer Betas for users on default app settings.
#
# Before tagging, update CHANGELOG.md: .pkgmeta hands it to CurseForge as the
# file's changelog, in place of a list of commit messages.
#
# Tags have no "v" so the CurseForge file is named "Fireside-0.1.0-beta1". The
# packager turns anything but letters, digits and . _ ! - into "_", spaces
# included, so the label cannot read "Fireside 0.1.0-beta1".
#
# The BigWigs packager reads the game version from "## Interface: 16001" in
# Fireside.toc, which it maps to the WoW Forever flavor on CurseForge.
# Uploading to CurseForge needs two things, both set up once by hand:
#   - "## X-Curse-Project-ID: <id>" in Fireside.toc
#   - a CF_API_KEY repository secret (Settings > Secrets and variables > Actions)
# Without them the job still builds the zip and attaches it to a GitHub release.

name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        with:
          args: '-n "{package-name}-{project-version}:{package-name}-{project-version}"'
